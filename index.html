<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff6ea3">
  <title>Для Даши</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💗</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Nunito:wght@600;800&family=Unbounded:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --rose: #e2186a;
      --ink: #9d1454;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #ff6ea3;
      font-family: Nunito, "Segoe UI", sans-serif;
    }

    .bg {
      position: fixed;
      inset: -12%;
      background:
        radial-gradient(circle at 18% 22%, #ffe4f2 0, transparent 36%),
        radial-gradient(circle at 82% 12%, #ffc2dc 0, transparent 34%),
        radial-gradient(circle at 74% 78%, #ff8ebc 0, transparent 40%),
        radial-gradient(circle at 12% 86%, #ffd7a8 0, transparent 28%),
        linear-gradient(165deg, #ffb3d4, #ff5f9e 42%, #ff87b7 72%, #ffd0e6);
      animation: drift 16s ease-in-out infinite alternate;
      z-index: 0;
    }

    body.party .bg {
      animation-duration: 7s;
      filter: saturate(1.2) brightness(1.04);
    }

    @keyframes drift {
      from { transform: scale(1) translate3d(0, 0, 0); }
      to { transform: scale(1.1) translate3d(-2%, -2%, 0); }
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(8px);
      opacity: 0.55;
      z-index: 1;
      pointer-events: none;
    }

    .o1 {
      width: 280px; height: 280px;
      left: -60px; top: 18%;
      background: #fff;
      animation: blob 11s ease-in-out infinite;
    }

    .o2 {
      width: 340px; height: 340px;
      right: -90px; bottom: 6%;
      background: #ffd36e;
      opacity: 0.35;
      animation: blob 13s ease-in-out infinite reverse;
    }

    .o3 {
      width: 180px; height: 180px;
      left: 58%; top: 8%;
      background: #fff;
      opacity: 0.4;
      animation: blob 9s ease-in-out infinite;
    }

    @keyframes blob {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(24px, -30px, 0) scale(1.08); }
    }

    #sky {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    .lights {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 46px;
      z-index: 7;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 10px 8px 0;
    }

    .lights::before {
      content: "";
      position: absolute;
      top: 14px;
      left: 0;
      right: 0;
      height: 2px;
      background: rgba(255, 255, 255, 0.55);
    }

    .lights i {
      width: 12px;
      height: 16px;
      border-radius: 8px 8px 7px 7px;
      display: block;
      position: relative;
      animation: blink 1.3s ease-in-out infinite;
      box-shadow: 0 0 10px currentColor;
    }

    .lights i::after {
      content: "";
      position: absolute;
      left: 3px;
      top: -8px;
      width: 6px;
      height: 8px;
      border: 2px solid rgba(255, 255, 255, 0.7);
      border-bottom: 0;
      border-radius: 6px 6px 0 0;
    }

    @keyframes blink {
      0%, 100% { filter: brightness(1); transform: scale(1); }
      50% { filter: brightness(1.45); transform: scale(1.08); }
    }

    .floaters {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      overflow: hidden;
    }

    .floater {
      position: absolute;
      bottom: -10vh;
      animation: rise linear infinite;
      will-change: transform;
      filter: drop-shadow(0 6px 8px rgba(180, 30, 80, 0.15));
    }

    @keyframes rise {
      0% { transform: translate3d(0, 12vh, 0) rotate(-8deg); opacity: 0; }
      10% { opacity: 1; }
      100% { transform: translate3d(var(--sway), -120vh, 0) rotate(16deg); opacity: 0; }
    }

    .note {
      position: fixed;
      top: max(58px, calc(env(safe-area-inset-top) + 52px));
      left: 50%;
      width: min(92vw, 390px);
      transform: translateX(-50%) translateY(-180%);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(16px);
      border-radius: 22px;
      padding: 14px 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      box-shadow: 0 18px 50px rgba(170, 20, 70, 0.22);
      z-index: 20;
      opacity: 0;
    }

    .note.show {
      animation: drop 0.6s cubic-bezier(.2, 1.35, .35, 1) forwards;
    }

    .note.hide {
      animation: lift 0.35s ease forwards;
    }

    @keyframes drop {
      to { transform: translateX(-50%) translateY(0); opacity: 1; }
    }

    @keyframes lift {
      to { transform: translateX(-50%) translateY(-180%); opacity: 0; }
    }

    .note-icon {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      font-size: 26px;
      background: linear-gradient(180deg, #ffe1ef, #ffc2dc);
      animation: pulse 1.1s ease-in-out infinite;
      flex: none;
    }

    .note strong {
      display: block;
      color: var(--ink);
      font-size: 1.15rem;
      line-height: 1.15;
    }

    .note span {
      display: block;
      margin-top: 2px;
      color: #c4477a;
      font-weight: 600;
      font-size: 0.92rem;
    }

    .stage {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 8;
    }

    .stage.hide {
      animation: bye 0.45s ease forwards;
      pointer-events: none;
    }

    @keyframes bye {
      to { opacity: 0; transform: scale(0.7); }
    }

    .halo {
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.55), transparent 68%);
      animation: halo 2.2s ease-in-out infinite;
    }

    @keyframes halo {
      0%, 100% { transform: scale(0.92); opacity: 0.7; }
      50% { transform: scale(1.12); opacity: 1; }
    }

    .btn {
      position: relative;
      border: 0;
      cursor: pointer;
      font-family: Unbounded, Nunito, sans-serif;
      font-size: clamp(1.35rem, 4.4vw, 2rem);
      color: var(--rose);
      background: linear-gradient(#fff, #ffe7f2);
      padding: 22px 58px 20px;
      border-radius: 999px;
      box-shadow:
        0 10px 0 #f3a3c8,
        0 20px 40px rgba(180, 20, 80, 0.28);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:hover { transform: translateY(-2px); }

    .btn:active {
      transform: translateY(7px);
      box-shadow:
        0 3px 0 #f3a3c8,
        0 10px 20px rgba(180, 20, 80, 0.22);
    }

    .btn:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 6px;
    }

    .btn.again {
      animation: nibble 0.7s cubic-bezier(.2, 1.4, .4, 1);
    }

    @keyframes nibble {
      0% { transform: scale(1); }
      35% { transform: scale(1.08) rotate(-2deg); }
      70% { transform: scale(0.96) rotate(2deg); }
      100% { transform: scale(1); }
    }

    .flash {
      position: fixed;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      z-index: 30;
    }

    .flash.go { animation: flash 0.8s ease; }

    @keyframes flash {
      0% { opacity: 0.9; }
      100% { opacity: 0; }
    }

    .finale {
      position: fixed;
      inset: 0;
      z-index: 9;
      display: grid;
      place-items: center;
      align-content: center;
      text-align: center;
      padding: 24px;
      pointer-events: none;
    }

    .finale[hidden] { display: none; }

    .mini {
      margin: 0;
      font-size: clamp(1.4rem, 4vw, 2rem);
      letter-spacing: 0.4em;
      opacity: 0;
    }

    .finale.show .mini {
      animation: pop 0.7s cubic-bezier(.2, 1.4, .3, 1) 0.15s forwards;
    }

    .finale.show .late { animation-delay: 0.85s; }

    h1 {
      margin: 8px 0 10px;
      font-family: "Marck Script", "Segoe Script", cursive;
      font-weight: 400;
      font-size: clamp(4.2rem, 13vw, 8.4rem);
      line-height: 0.88;
      color: #fff;
    }

    .line {
      display: block;
      opacity: 0;
      text-shadow:
        0 3px 0 rgba(176, 30, 90, 0.28),
        0 16px 34px rgba(150, 15, 60, 0.35);
    }

    .finale.show .line {
      animation: pop 0.85s cubic-bezier(.16, 1.4, .3, 1) forwards;
    }

    .finale.show .line:nth-child(2) { animation-delay: 0.28s; }

    .finale.show h1 {
      animation: floaty 3.4s ease-in-out 1.2s infinite;
    }

    @keyframes pop {
      0% { opacity: 0; transform: translateY(36px) scale(0.72) rotate(-3deg); }
      100% { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
    }

    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="orb o1"></div>
  <div class="orb o2"></div>
  <div class="orb o3"></div>
  <canvas id="sky"></canvas>
  <div class="lights" id="lights" aria-hidden="true"></div>
  <div class="floaters" id="floaters" aria-hidden="true"></div>
  <div class="flash" id="flash"></div>

  <div class="note" id="note" role="status">
    <div class="note-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#e2186a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 10v4h3l5 4V6L7 10H4z"/>
        <path d="M16.5 9a3.5 3.5 0 0 1 0 6"/>
        <path d="M18.8 7a6.2 6.2 0 0 1 0 10"/>
      </svg>
    </div>
    <div>
      <strong>Включи звук</strong>
      <span>и нажми на кнопку ещё раз</span>
    </div>
  </div>

  <main class="stage" id="stage">
    <div class="halo" aria-hidden="true"></div>
    <button class="btn" id="btn" type="button">Нажми</button>
  </main>

  <section class="finale" id="finale" hidden>
    <p class="mini">✨ 💗 ✨</p>
    <h1>
      <span class="line">Даша</span>
      <span class="line">не грусти</span>
    </h1>
    <p class="mini late">💖 🌸 💖</p>
  </section>

  <script>
    const btn = document.getElementById("btn");
    const note = document.getElementById("note");
    const stage = document.getElementById("stage");
    const finale = document.getElementById("finale");
    const flash = document.getElementById("flash");
    const floaters = document.getElementById("floaters");
    const canvas = document.getElementById("sky");
    const ctx = canvas.getContext("2d");

    const bulbColors = ["#ff4d6d", "#ffd166", "#fff", "#ff8fab", "#e599f7", "#9ae6b4"];
    const lights = document.getElementById("lights");
    for (let i = 0; i < 22; i++) {
      const bulb = document.createElement("i");
      bulb.style.background = bulbColors[i % bulbColors.length];
      bulb.style.color = bulbColors[i % bulbColors.length];
      bulb.style.animationDelay = (i % 5) * 0.18 + "s";
      lights.appendChild(bulb);
    }

    const glyphs = ["💗", "💖", "✨", "🌸", "⭐", "🎀"];
    function spawnFloater(extra) {
      const el = document.createElement("span");
      el.className = "floater";
      el.textContent = glyphs[(Math.random() * glyphs.length) | 0];
      el.style.left = Math.random() * 100 + "%";
      el.style.fontSize = (extra ? 22 : 16) + Math.random() * (extra ? 34 : 22) + "px";
      el.style.animationDuration = (extra ? 4.5 : 8) + Math.random() * 6 + "s";
      el.style.animationDelay = extra ? "0s" : -Math.random() * 10 + "s";
      el.style.setProperty("--sway", (Math.random() * 80 - 40) + "px");
      floaters.appendChild(el);
    }
    for (let i = 0; i < 16; i++) spawnFloater(false);

    let W = 0;
    let H = 0;
    const particles = [];
    const rockets = [];
    const confetti = [];
    let party = false;
    let last = performance.now();
    let launchAt = 0;

    function resize() {
      const dpr = 1;
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = Math.floor(W * dpr);
      canvas.height = Math.floor(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener("resize", resize);

    function drawHeart(x, y, size, color, alpha) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(size, size);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(0, 0.35);
      ctx.bezierCurveTo(-0.05, -0.35, -1, -0.35, -1, 0.2);
      ctx.bezierCurveTo(-1, 0.7, 0, 0.95, 0, 1.25);
      ctx.bezierCurveTo(0, 0.95, 1, 0.7, 1, 0.2);
      ctx.bezierCurveTo(1, -0.35, 0.05, -0.35, 0, 0.35);
      ctx.fill();
      ctx.restore();
    }

    const palette = ["#fffef6", "#ffe14a", "#ff3d7a", "#fff", "#ffb703", "#ffd6ea", "#ffef9a"];

    function burst(x, y, kind) {
      if (kind === "heart") {
        const n = 36;
        for (let i = 0; i < n; i++) {
          const t = (i / n) * Math.PI * 2;
          const hx = 16 * Math.pow(Math.sin(t), 3);
          const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
          const scale = 3.4 + Math.random();
          particles.push({
            x, y,
            vx: hx * scale,
            vy: hy * scale,
            life: 1,
            decay: 0.28 + Math.random() * 0.16,
            size: 9 + Math.random() * 8,
            color: i % 3 === 0 ? "#ffe14a" : "#ff4d88",
            heart: true,
            g: 22
          });
        }
        return;
      }
      const n = 64;
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = 80 + Math.random() * 340;
        particles.push({
          x, y,
          vx: Math.cos(a) * s,
          vy: Math.sin(a) * s,
          life: 1,
          decay: 0.28 + Math.random() * 0.34,
          size: 2.4 + Math.random() * 3.6,
          color: palette[(Math.random() * palette.length) | 0],
          heart: Math.random() < 0.12,
          g: 70
        });
      }
    }

    function launch() {
      rockets.push({
        x: W * (0.12 + Math.random() * 0.76),
        y: H + 6,
        vx: (Math.random() - 0.5) * 60,
        vy: -(460 + Math.random() * 260),
        target: H * (0.1 + Math.random() * 0.4),
        heart: Math.random() < 0.42
      });
    }

    function cannon(side) {
      const x = side < 0 ? 0 : W;
      for (let i = 0; i < 36; i++) {
        confetti.push({
          x,
          y: H * (0.35 + Math.random() * 0.4),
          vx: side * (160 + Math.random() * 420),
          vy: -180 - Math.random() * 320,
          w: 6 + Math.random() * 8,
          h: 10 + Math.random() * 10,
          rot: Math.random() * 6,
          vr: (Math.random() - 0.5) * 8,
          color: ["#fff", "#ffd166", "#ff5d9a", "#ffd0e6", "#c084fc", "#fff6c8"][(Math.random() * 6) | 0],
          life: 1
        });
      }
    }

    function tick(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;

      if (!party && Math.random() < 0.35) {
        particles.push({
          x: Math.random() * W,
          y: Math.random() * H,
          vx: (Math.random() - 0.5) * 12,
          vy: -8 - Math.random() * 16,
          life: 1,
          decay: 0.35,
          size: 1.4 + Math.random() * 2,
          color: "#fff",
          heart: false,
          g: 0
        });
      }

      if (party && now >= launchAt && rockets.length < 5) {
        launch();
        if (Math.random() < 0.65) launch();
        launchAt = now + 280 + Math.random() * 220;
        if (Math.random() < 0.45) cannon(Math.random() < 0.5 ? -1 : 1);
        if (Math.random() < 0.22) burst(W * (0.22 + Math.random() * 0.56), H * (0.16 + Math.random() * 0.32), "heart");
      }

      ctx.clearRect(0, 0, W, H);
      ctx.globalCompositeOperation = "lighter";

      for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i];
        r.x += r.vx * dt;
        r.y += r.vy * dt;
        r.vy += 80 * dt;
        if (Math.random() < 0.55) {
          particles.push({
            x: r.x, y: r.y, vx: 0, vy: 30, life: 0.4, decay: 2,
            size: 2.2, color: "#fff4c4", heart: false, g: 0
          });
        }
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(r.x, r.y, 2.4, 0, Math.PI * 2);
        ctx.fill();
        if (r.y <= r.target) {
          burst(r.x, r.y, r.heart ? "heart" : "boom");
          if (Math.random() < 0.55) sparkle();
          rockets.splice(i, 1);
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= p.decay * dt;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        p.vy += p.g * dt;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= 0.985;
        ctx.globalAlpha = Math.min(1, p.life + 0.12);
        if (p.heart) drawHeart(p.x, p.y, p.size * Math.max(p.life, 0.4), p.color, ctx.globalAlpha);
        else {
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * (0.7 + p.life * 0.5), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
      ctx.globalCompositeOperation = "source-over";

      for (let i = confetti.length - 1; i >= 0; i--) {
        const c = confetti[i];
        c.life -= 0.18 * dt;
        if (c.life <= 0 || c.y > H + 30) {
          confetti.splice(i, 1);
          continue;
        }
        c.vy += 280 * dt;
        c.x += c.vx * dt;
        c.y += c.vy * dt;
        c.vx *= 0.99;
        c.rot += c.vr * dt;
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(c.rot);
        ctx.globalAlpha = Math.max(c.life, 0);
        ctx.fillStyle = c.color;
        ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
        ctx.restore();
      }

      if (particles.length > 520) particles.splice(0, particles.length - 520);
      if (confetti.length > 180) confetti.splice(0, confetti.length - 180);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    let audioCtx = null;
    let musicTimer = 0;
    const beat = 0.34;
    const loopBeats = 24;
    const melody = [
      [784, 0, 1], [659, 1, 1], [784, 2, 1], [659, 3, 1],
      [880, 4, 1], [784, 5, 0.5], [698, 5.5, 0.5], [659, 6, 1], [587, 7, 1],
      [659, 8, 1], [784, 9, 1], [1047, 10, 2],
      [988, 12, 1], [880, 13, 1], [784, 14, 1], [659, 15, 1],
      [880, 16, 1], [784, 17, 1], [698, 18, 1], [659, 19, 1],
      [587, 20, 1], [659, 21, 1], [784, 22, 1], [523, 23, 1]
    ];
    const chords = [
      [0, [262, 330, 392], 131],
      [4, [220, 262, 330], 110],
      [8, [175, 220, 262], 87],
      [12, [196, 247, 294], 98],
      [16, [262, 330, 392], 131],
      [20, [196, 247, 294], 98]
    ];
    const chimeNotes = [1047, 1175, 1319, 1568, 1760];

    function ensureAudio() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }

    function tone(context, dest, freq, time, dur, gainValue, type) {
      const osc = context.createOscillator();
      const gain = context.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq, time);
      gain.gain.setValueAtTime(0.0001, time);
      gain.gain.exponentialRampToValueAtTime(Math.max(gainValue, 0.0002), time + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + Math.max(dur, 0.05));
      osc.connect(gain);
      gain.connect(dest);
      osc.start(time);
      osc.stop(time + dur + 0.03);
    }

    function playDing() {
      const context = ensureAudio();
      if (!context) return;
      const t = context.currentTime + 0.02;
      tone(context, context.destination, 880, t, 0.28, 0.06, "sine");
      tone(context, context.destination, 1175, t + 0.1, 0.34, 0.05, "sine");
    }

    function sparkle() {
      if (!audioCtx || audioCtx.state !== "running") return;
      const freq = chimeNotes[(Math.random() * chimeNotes.length) | 0];
      tone(audioCtx, audioCtx.destination, freq, audioCtx.currentTime, 0.22, 0.03, "sine");
    }

    function startMusic() {
      const context = ensureAudio();
      if (!context) return;
      const master = context.createGain();
      master.gain.setValueAtTime(0.0001, context.currentTime);
      master.gain.exponentialRampToValueAtTime(0.9, context.currentTime + 0.4);
      master.connect(context.destination);

      const now = context.currentTime + 0.05;
      [523, 659, 784, 1047].forEach((freq, i) => {
        tone(context, master, freq, now + i * 0.11, 0.42, 0.11, "sine");
        tone(context, master, freq * 2, now + i * 0.11, 0.3, 0.03, "triangle");
      });

      let next = now + 0.62;
      const schedule = (start) => {
        melody.forEach(([freq, at, len]) => {
          const t = start + at * beat;
          tone(context, master, freq, t, len * beat * 0.92, 0.08, "sine");
          tone(context, master, freq * 2.01, t, len * beat * 0.7, 0.02, "triangle");
        });
        chords.forEach(([at, notes, bass]) => {
          const t = start + at * beat;
          notes.forEach((freq) => tone(context, master, freq, t, beat * 3.6, 0.022, "triangle"));
          tone(context, master, bass, t, beat * 3.5, 0.05, "sine");
        });
      };

      const pump = () => {
        if (!audioCtx) return;
        while (next < context.currentTime + 1.4) {
          schedule(next);
          next += loopBeats * beat;
        }
        musicTimer = window.setTimeout(pump, 280);
      };
      pump();
    }

    let step = 0;
    btn.addEventListener("click", () => {
      if (step === 0) {
        step = 1;
        ensureAudio();
        playDing();
        note.classList.remove("hide");
        note.classList.add("show");
        btn.textContent = "Ещё раз";
        btn.classList.remove("again");
        void btn.offsetWidth;
        btn.classList.add("again");
        return;
      }
      if (step !== 1) return;
      step = 2;
      startParty();
    });

    function startParty() {
      party = true;
      note.classList.remove("show");
      note.classList.add("hide");
      stage.classList.add("hide");
      flash.classList.add("go");
      finale.hidden = false;
      requestAnimationFrame(() => finale.classList.add("show"));
      document.body.classList.add("party");
      if (navigator.vibrate) navigator.vibrate([30, 40, 50]);

      for (let i = 0; i < 24; i++) spawnFloater(true);
      for (let i = 0; i < 8; i++) window.setTimeout(launch, i * 110);
      cannon(-1);
      cannon(1);
      burst(W * 0.5, H * 0.38, "heart");
      burst(W * 0.28, H * 0.3, "boom");
      burst(W * 0.72, H * 0.3, "boom");
      launchAt = performance.now() + 700;

      const context = ensureAudio();
      if (!context) return;
      if (context.state === "suspended") context.resume().then(startMusic);
      else startMusic();
    }
  </script>
